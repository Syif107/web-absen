<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Absen - RelawanSync V2</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#4F46E5', secondary: '#818CF8' } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR UTAMA -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col shadow-sm z-10 shrink-0 transition-all duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-100 justify-between">
            <div class="flex items-center gap-2 text-primary font-bold text-xl tracking-tight whitespace-nowrap">
                <i class="fa-solid fa-fingerprint nav-icon"></i><span class="sidebar-text">RelawanSync V2</span>
            </div>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="index.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-medium transition-colors text-left">
                <i class="fa-solid fa-chart-pie w-6 text-center nav-icon"></i><span class="sidebar-text">Dashboard Analytics</span>
            </a>
            <a href="input.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-medium transition-colors text-left">
                <i class="fa-solid fa-users-viewfinder w-6 text-center nav-icon"></i><span class="sidebar-text">Validasi Absensi</span>
            </a>
            
            <!-- Menu Aktif (Warna Biru) -->
            <a href="riwayat.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 bg-indigo-50 text-primary rounded-xl font-medium transition-colors text-left">
                <i class="fa-solid fa-clipboard-list w-6 text-center nav-icon"></i><span class="sidebar-text">Riwayat Absen</span>
            </a>
            
            <a href="master.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-slate-500 hover:bg-slate-50 rounded-xl font-medium transition-colors text-left">
                <i class="fa-solid fa-database w-6 text-center nav-icon"></i><span class="sidebar-text">Master Data</span>
            </a>
        </nav>
        
        <div class="p-4 bg-slate-50 m-2 rounded-xl border border-slate-100">
            <button onclick="logoutSystem()" class="w-full flex items-center justify-center gap-2 text-red-600 font-bold text-sm hover:bg-red-50 py-2 rounded-lg transition-colors">
                <i class="fa-solid fa-power-off"></i><span class="sidebar-text">Keluar (Lock)</span>
            </button>
        </div>
    </aside>

    <!-- KONTEN UTAMA RIWAYAT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-6 shadow-sm shrink-0">
            <div class="flex items-center gap-4">
                <button id="btnToggleSidebar" class="text-slate-500 hover:text-primary hover:bg-slate-100 w-10 h-10 rounded-lg transition-colors flex items-center justify-center">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h1 class="text-xl font-bold text-slate-800 hidden sm:block">Log & Riwayat Absen</h1>
            </div>
            <button onclick="exportToCSV()" class="text-sm bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold transition-colors flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-excel"></i> Export CSV
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-50 custom-scroll relative">
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-50/90 z-20 flex flex-col items-center justify-center">
                <i class="fa-solid fa-circle-notch fa-spin text-5xl text-primary mb-4"></i>
                <p class="text-slate-600 font-bold tracking-wide">Menarik Data Log...</p>
            </div>

            <div class="max-w-7xl mx-auto space-y-4">
                
                <!-- Filter Bar -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-end gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase block mb-1">Tanggal</label>
                        <input type="date" id="filterTanggal" class="bg-slate-50 border border-slate-300 text-sm rounded-lg px-3 py-2 outline-none font-semibold">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase block mb-1">Cari Nama / Instansi</label>
                        <input type="text" id="filterCari" placeholder="Ketik kata kunci..." class="bg-slate-50 border border-slate-300 text-sm rounded-lg px-3 py-2 outline-none w-64">
                    </div>
                    <button onclick="loadRiwayatData()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-bold transition-colors text-sm">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> Terapkan
                    </button>
                    <button onclick="resetFilter()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold transition-colors text-sm">
                        Reset
                    </button>
                </div>

                <!-- Tabel Data -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto custom-scroll">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-100 text-slate-600 font-bold">
                                <tr>
                                    <th class="px-4 py-3 text-center w-12">No</th>
                                    <th class="px-4 py-3">Waktu Rekam</th>
                                    <th class="px-4 py-3">Nama Relawan</th>
                                    <th class="px-4 py-3">Sesi</th>
                                    <th class="px-4 py-3">Lokasi Proyek</th>
                                    <th class="px-4 py-3">Organisasi</th>
                                    <th class="px-4 py-3 text-center w-20">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="riwayatBody" class="divide-y divide-slate-100">
                                <!-- Data akan dimuat via JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-between items-center text-xs font-bold text-slate-500">
                        <span id="totalDataInfo">Menampilkan 0 data</span>
                    </div>
                </div>

            </div>
        </div>
        
        <div id="toastContainer" class="fixed top-20 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>
    </main>

    <!-- MODULE SCRIPTS -->
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/riwayat.js"></script>

</body>
</html>
